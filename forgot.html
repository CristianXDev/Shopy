<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Boutique Moderna</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Google Fonts: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <link href='css/style.css' rel='stylesheet'>
    <link href='css/auth.css' rel='stylesheet'>

    <!-- == HEAD == -->

    <style>
        /* Sólo estilos únicos de recuperación que no están en auth.css ni style.css */
        .image-section {
            background: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
        }

        .btn-submit {
            margin-bottom: 25px;
        }
    </style>

    <!-- == /HEAD == -->

</head>
<body>

    <!-- == SPLIT LAYOUT == -->
    <div class="split-layout">

        <!-- == IMAGE SECTION == -->
        <div class="image-section">
            <div class="image-overlay"></div>
            <a href="index.html" class="brand-logo-white">logo<br>here</a>

            <div class="image-text">
                <h2>Recupera tu acceso.</h2>
                <p>Te ayudaremos a restablecer tu contraseña para que sigas explorando.</p>
            </div>
        </div>
        <!-- == /IMAGE SECTION == -->

        <!-- == FORM SECTION == -->
        <div class="form-section">

            <!-- == FORM CONTAINER == -->
            <div class="form-container">

                <a href="index.html" class="mobile-logo">logo<br>here</a>

                <div class="form-header">
                    <h1>¿Olvidaste tu contraseña?</h1>
                    <p>Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace seguro para restablecerla.</p>
                </div>

                <!-- == FORM == -->
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                    </div>

                    <button type="submit" class="btn-submit">Enviar enlace de recuperación</button>
                </form>
                <!-- == /FORM == -->

                <!-- == FORM FOOTER == -->
                <div class="form-footer">
                    <a href="login.html">
                        <i class='bx bx-left-arrow-alt'></i>
                        Volver a iniciar sesión
                    </a>
                </div>
                <!-- == /FORM FOOTER == -->

            </div>
            <!-- == /FORM CONTAINER == -->

        </div>
        <!-- == /FORM SECTION == -->

    </div>
    <!-- == /SPLIT LAYOUT == -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
