<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Boutique Moderna</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Google Fonts: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <link href='css/style.css' rel='stylesheet'>
    <link href='css/auth.css' rel='stylesheet'>

    <!-- == HEAD == -->

    <style>
        /* Sólo estilos únicos de registro que no están en auth.css ni style.css */
        .image-section {
            background: url('https://images.unsplash.com/photo-1445205170230-053b83016050?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
        }
    </style>

    <!-- == /HEAD == -->

</head>
<body>

    <!-- == SPLIT LAYOUT == -->
    <div class="split-layout">

        <!-- == IMAGE SECTION == -->
        <div class="image-section">
            <div class="image-overlay"></div>
            <a href="index.html" class="brand-logo-white">logo<br>here</a>

            <div class="image-text">
                <h2>Únete a nosotros.</h2>
                <p>Crea tu cuenta para acceder a colecciones exclusivas y gestionar tus pedidos.</p>
            </div>
        </div>
        <!-- == /IMAGE SECTION == -->

        <!-- == FORM SECTION == -->
        <div class="form-section">

            <!-- == FORM CONTAINER == -->
            <div class="form-container">

                <a href="index.html" class="mobile-logo">logo<br>here</a>

                <div class="form-header">
                    <h1>Crea tu cuenta</h1>
                    <p>Únete a nuestra comunidad en pocos pasos.</p>
                </div>

                <!-- == OAUTH BUTTONS == -->
                <div class="oauth-buttons">
                    <button class="btn-oauth">
                        <i class='bx bxl-google' style="color: #DB4437;"></i>
                        Registrarse con Google
                    </button>
                    <button class="btn-oauth">
                        <i class='bx bxl-apple' style="color: #121212;"></i>
                        Registrarse con Apple
                    </button>
                </div>
                <!-- == /OAUTH BUTTONS == -->

                <div class="divider">o regístrate con correo</div>

                <!-- == FORM == -->
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name" class="form-label">Nombre Completo</label>
                        <input type="text" id="name" class="form-control" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="form-group">
                            <label for="password_confirmation" class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="password_confirmation" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="extra-options">
                        <div class="form-check d-flex align-items-center">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms">
                                Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Crear Cuenta</button>
                </form>
                <!-- == /FORM == -->

                <!-- == FORM FOOTER == -->
                <div class="form-footer">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
                </div>
                <!-- == /FORM FOOTER == -->

            </div>
            <!-- == /FORM CONTAINER == -->

        </div>
        <!-- == /FORM SECTION == -->

    </div>
    <!-- == /SPLIT LAYOUT == -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
