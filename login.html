<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Boutique Moderna</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Google Fonts: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <link href='css/style.css' rel='stylesheet'>
    <link href='css/auth.css' rel='stylesheet'>

    <!-- == HEAD == -->

    <style>
        /* Sólo estilos únicos de login que no están en auth.css ni style.css */
        @media (min-width: 992px) {
            body {
                overflow: hidden; /* Evita scroll en desktop para un look limpio de app */
            }
        }

        .image-section {
            background: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
        }
    </style>

    <!-- == /HEAD == -->

</head>
<body>

    <!-- == SPLIT LAYOUT == -->
    <div class="split-layout">

        <!-- == IMAGE SECTION == -->
        <div class="image-section">
            <div class="image-overlay"></div>
            <a href="index.html" class="brand-logo-white">logo<br>here</a>

            <div class="image-text">
                <h2>Descubre tu esencia.</h2>
                <p>Accede a la nueva colección y beneficios exclusivos para miembros.</p>
            </div>
        </div>
        <!-- == /IMAGE SECTION == -->

        <!-- == FORM SECTION == -->
        <div class="form-section">

            <!-- == FORM CONTAINER == -->
            <div class="form-container">

                <a href="index.html" class="mobile-logo">logo<br>here</a>

                <div class="form-header">
                    <h1>Bienvenido de nuevo</h1>
                    <p>Por favor, ingresa tus datos para continuar.</p>
                </div>

                <!-- == OAUTH BUTTONS == -->
                <div class="oauth-buttons">
                    <button class="btn-oauth">
                        <i class='bx bxl-google' style="color: #DB4437;"></i>
                        Continuar con Google
                    </button>
                    <button class="btn-oauth">
                        <i class='bx bxl-apple' style="color: #121212;"></i>
                        Continuar con Apple
                    </button>
                </div>
                <!-- == /OAUTH BUTTONS == -->

                <div class="divider">o inicia sesión con correo</div>

                <!-- == FORM == -->
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="extra-options">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Recordarme
                            </label>
                        </div>
                        <a href="forgot.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-submit">Iniciar Sesión</button>
                </form>
                <!-- == /FORM == -->

                <!-- == FORM FOOTER == -->
                <div class="form-footer">
                    ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
                </div>
                <!-- == /FORM FOOTER == -->

            </div>
            <!-- == /FORM CONTAINER == -->

        </div>
        <!-- == /FORM SECTION == -->

    </div>
    <!-- == /SPLIT LAYOUT == -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
